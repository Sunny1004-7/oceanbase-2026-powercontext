            key: ''
            type: text
            value: '{{#validate.commit_body#}}'
          type: raw-text
        desc: ''
        error_strategy: fail-branch
        headers: 'Authorization:Bearer {{#env.PC_TOKEN#}}

          Content-Type:application/json'
        method: post
