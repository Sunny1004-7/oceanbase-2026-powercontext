<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知页 · 本地知识库</title><link rel="stylesheet" href="/src/style.css"></head><body>
<header><a class="brand" href="/">知页<span>本地知识库</span></a><div class="status"><span id="backend">模型尚未加载</span><span id="current">学习笔记</span></div></header>
<div class="layout"><aside><h2>我的知识库</h2><label for="kb">当前知识库</label><select id="kb"><option value="notes">学习笔记</option><option value="work">工作资料</option><option value="eval">评测语料</option></select><p id="count">0 篇文档</p><div class="privacy"><strong>在你的设备上理解文本</strong><p>文档与问题在当前浏览器生成向量，资料保存在本地 seekdb。</p></div><details><summary>运行选项</summary><label for="precision">推理方案</label><select id="precision"><option value="auto">自动选择（优先 GPU）</option><option value="wasm_q8">INT8 / WASM</option><option value="wasm_fp32">FP32 / WASM 基线</option><option value="wasm_fp16">FP16 / WASM</option></select></details></aside>
<main><div class="page-heading"><div><h1>从笔记中找到答案</h1><p>输入关键词，或用自己的话描述要找的内容。</p></div><span class="bookmark" aria-hidden="true"></span></div><form id="search-form"><label class="sr-only" for="query">搜索当前知识库</label><div class="search-bar"><input id="query" placeholder="例如：手机丢了，怎样保护账户？" autocomplete="off" maxlength="200"><button id="search" type="submit">搜索笔记</button></div></form><p id="notice" role="status" aria-live="polite">先导入几篇笔记，再开始搜索。</p><section aria-label="搜索结果" id="results"><div class="empty"><div class="page-icon" aria-hidden="true">≡</div><h2>你的笔记，随时可查</h2><p>从右侧导入文本，或载入 50 篇示例笔记体验检索。</p></div></section></main>
<section class="import-panel" aria-labelledby="import-title"><h2 id="import-title">添加笔记</h2><p>每篇笔记用一个空行分隔。相同 ID 的笔记会更新原文。</p><label for="text">粘贴文本</label><textarea id="text" rows="10" placeholder="在这里粘贴笔记内容……"></textarea><label for="files">或选择 .txt / .json 文件</label><input type="file" id="files" accept=".txt,.json" multiple><div class="actions"><button id="import" type="button">导入当前知识库</button><button id="sample" type="button" class="secondary">载入示例笔记</button></div><progress id="progress" value="0" max="100" hidden></progress><p id="import-status" role="status" aria-live="polite"></p><p class="hint">刷新页面后，已导入的资料仍可检索。</p></section></div>
<footer>知页 <span>浏览器本地推理 / seekdb 混合检索</span><a href="/TECHNICAL.md">技术说明</a></footer><script type="module" src="/src/app.js"></script></body></html>
